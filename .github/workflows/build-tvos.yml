name: Build tvOS

# Build app cho Apple TV (không ký) và đóng gói thành MyTivi.ipa.
# Mỗi lần push lên main: tạo Release "v<số lượt build>" kèm MyTivi.ipa,
# dùng để cài bằng atvloadly (tự ký bằng Apple ID và tự gia hạn) hoặc công cụ sideload khác.
on:
  workflow_dispatch:
  push:
  pull_request:

# Cần quyền ghi để tạo bản phát hành (Release)
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i appletv || true

      - name: Download tvOS platform if missing
        run: |
          if ! xcrun simctl list runtimes | grep -q tvOS; then
            xcodebuild -downloadPlatform tvOS
          fi

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MyTivi.xcodeproj \
            -scheme MyTivi \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package MyTivi.ipa
        run: |
          APP="build/Build/Products/Release-appletvos/MyTivi.app"
          test -d "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../MyTivi.ipa Payload)
          ls -lh MyTivi.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload MyTivi.ipa
        uses: actions/upload-artifact@v4
        with:
          name: MyTivi-ipa
          path: MyTivi.ipa

      # Tạo Release "v<số lượt build>" kèm MyTivi.ipa (chỉ khi push lên main hoặc chạy tay)
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "$TAG" MyTivi.ipa \
            --title "MyTivi tvOS 1.0.${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest \
            || gh release upload "$TAG" MyTivi.ipa --clobber
